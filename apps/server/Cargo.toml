[package]
name = "goodfinds"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[lib]
path = "src/lib.rs"

[[bin]]
name = "goodfinds"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
flate2 = "1"
iana-time-zone = "0.1"
ryu-js = "1"
jsonschema = { version = "0.58.6", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "3.5.1", default-features = false, features = [
  "server",
  "client",
  "transport-io",
  "elicitation",
] }
rrule = "0.14"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "fs",
  "net",
  "process",
  "signal",
  "sync",
  "time",
] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
flate2 = "1"
serde_json = "1"
