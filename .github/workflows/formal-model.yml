name: Seller action specification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seller-action-specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          build-args: "--wfail"
      - run: bun run formal:check
      - run: bun run docs:check
