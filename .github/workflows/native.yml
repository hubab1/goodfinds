name: Native server packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - run: bun run contracts:check
      - run: bun run architecture:check
      - run: bun run typecheck
      - run: bun run check:native
      - run: cargo test --manifest-path apps/server/Cargo.toml --locked
      - run: bun scripts/build-server.ts
      - run: bun scripts/package-plugin.ts
      - run: bun scripts/smoke-plugin.ts
      - uses: actions/upload-artifact@v4
        with:
          name: goodfinds-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
