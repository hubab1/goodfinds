name: Native server packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server -> target
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - run: bun run contracts:check
      - run: bun run architecture:check
      - run: bun run typecheck
      - run: bun run check:native
      - run: cargo test --manifest-path apps/server/Cargo.toml --locked
      - run: bun scripts/build-server.ts
      - run: bun scripts/package-plugin.ts
      - run: cargo build --manifest-path apps/server/Cargo.toml --locked --profile test-support --features test-support --example test-driver --bin goodfinds
      - run: bun test --timeout 30000 ./tests/build-target.test.ts ./tests/plugin-formats.test.ts ./tests/search-setup-mcp.test.ts ./tests/panel-handoff.test.ts
      - if: runner.os == 'Linux'
        run: bun test --timeout 30000 ./tests/marketplace-actions.test.ts ./tests/listing-shortlist-ui.test.ts
      - run: bun run package:check
      - uses: actions/upload-artifact@v4
        with:
          name: goodfinds-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*-codex-*.zip
            dist/*-claude-*.zip
            dist/*-claude-desktop-*.mcpb
          if-no-files-found: error
          compression-level: 0
